name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(jq -r .version package.json)
          if [ "$version" != "$declared" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $declared"
            exit 1
          fi

      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-preview*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Mosaic Framework ${GITHUB_REF_NAME#v}" --notes-file notes.md $flags
